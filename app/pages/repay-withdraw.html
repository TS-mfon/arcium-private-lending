<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Repay And Withdraw</title><link rel="icon" href="/app/favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="/app/site.css"/><script src="/app/wallet.js" defer></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="/app"><span class="brand-mark">R</span><span>Repay / Withdraw</span></a><nav class="nav-links"><a href="/app/pages/supply-borrow.html">Supply</a><a href="/app/pages/liquidation.html">Liquidate</a><button class="wallet-trigger" type="button" data-wallet-connect>Connect wallet</button></nav></header><section class="page-head"><p class="eyebrow">Function 02</p><h1>Manage your obligation.</h1><p class="lede">Repay debt or withdraw collateral only after wallet and health requirements are satisfied.</p></section><section class="layout"><form class="panel form-grid" data-action-form="Repay or withdraw"><label class="wide">Obligation account<input required placeholder="Obligation PDA or account"/></label><label>Action<select><option>Repay USDC</option><option>Withdraw collateral</option><option>Request health check</option></select></label><label>Amount<input type="number" min="0" step="0.01" placeholder="50"/></label><label class="wide">User wallet<output data-wallet-full>Connect a wallet to continue</output></label><div class="page-actions wide"><button class="action" type="submit" data-submit-action>Submit update</button></div></form></section></main></body></html>
